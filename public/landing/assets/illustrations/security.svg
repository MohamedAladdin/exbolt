<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" fill="none" role="img" aria-label="Security illustration">
  <defs>
    <linearGradient id="sh-shield" x1="240" y1="80" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E7BFF"/><stop offset="1" stop-color="#0A4DFF"/>
    </linearGradient>
    <filter id="sh-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0A2A80" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- halos -->
  <circle cx="310" cy="238" r="184" stroke="#C9D8FF" stroke-width="1.5" stroke-dasharray="3 9"/>
  <circle cx="310" cy="238" r="146" fill="#F1F5FF"/>
  <circle cx="310" cy="238" r="146" stroke="#DCE6FF" stroke-width="2"/>
  <path d="M310 54v22M310 400v22M128 238h22M470 238h22" stroke="#B9CCFF" stroke-width="2" stroke-linecap="round"/>

  <!-- shield -->
  <g filter="url(#sh-shadow)">
    <path d="M310 92c34 24 62 30 92 34v76c0 54-34 98-92 128-58-30-92-74-92-128v-76c30-4 58-10 92-34Z" fill="url(#sh-shield)"/>
    <path d="M310 92c34 24 62 30 92 34v76c0 54-34 98-92 128" fill="#fff" fill-opacity=".07"/>
    <path d="M310 120c26 18 47 23 70 26v56c0 42-26 76-70 101-44-25-70-59-70-101v-56c23-3 44-8 70-26Z" stroke="#fff" stroke-opacity=".4" stroke-width="2"/>
  </g>

  <!-- lock -->
  <g>
    <rect x="276" y="240" width="68" height="54" rx="12" fill="#fff"/>
    <path d="M290 240v-12a20 20 0 0 1 40 0v12" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="310" cy="263" r="6" fill="#0A4DFF"/>
    <path d="M310 269v10" stroke="#0A4DFF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- floating data card -->
  <g filter="url(#sh-shadow)" transform="translate(392 118) rotate(3)">
    <rect width="158" height="116" rx="16" fill="#fff" stroke="#E4E8F0" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="10" fill="#EAF0FF"/>
    <rect x="44" y="22" width="66" height="7" rx="3.5" fill="#DCE6FF"/>
    <rect x="44" y="34" width="44" height="6" rx="3" fill="#EDF1F8"/>
    <rect x="18" y="56" width="122" height="6" rx="3" fill="#EDF1F8"/>
    <rect x="18" y="70" width="98" height="6" rx="3" fill="#EDF1F8"/>
    <rect x="18" y="88" width="58" height="16" rx="8" fill="#EAF0FF"/>
    <path d="m82 96 3-3 3 3 3-3" stroke="#0A4DFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- key -->
  <g filter="url(#sh-shadow)" transform="translate(72 292) rotate(-8)">
    <rect width="132" height="74" rx="14" fill="#0A0F1A"/>
    <circle cx="30" cy="37" r="14" stroke="#6F97FF" stroke-width="3"/>
    <path d="M44 37h58M78 37v12M94 37v9" stroke="#6F97FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="37" r="4" fill="#6F97FF"/>
  </g>

  <!-- audit list -->
  <g filter="url(#sh-shadow)" transform="translate(64 92)">
    <rect width="150" height="150" rx="16" fill="#fff" stroke="#E4E8F0" stroke-width="1.5"/>
    <rect x="18" y="20" width="56" height="8" rx="4" fill="#DCE6FF"/>
    <g>
      <circle cx="26" cy="52" r="6" fill="#12B76A"/>
      <rect x="40" y="48" width="88" height="7" rx="3.5" fill="#EDF1F8"/>
      <circle cx="26" cy="80" r="6" fill="#12B76A"/>
      <rect x="40" y="76" width="72" height="7" rx="3.5" fill="#EDF1F8"/>
      <circle cx="26" cy="108" r="6" fill="#FFB020"/>
      <rect x="40" y="104" width="80" height="7" rx="3.5" fill="#EDF1F8"/>
    </g>
  </g>

  <!-- check badge -->
  <g filter="url(#sh-shadow)" transform="translate(448 330)">
    <circle cx="0" cy="0" r="30" fill="#12B76A"/>
    <path d="m-13 1 9 9 18-20" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M214 372c-22 10-38 24-48 44M406 380c18 8 32 20 42 38" stroke="#B9CCFF" stroke-width="2" stroke-dasharray="4 8" stroke-linecap="round"/>
</svg>
